name: Update 48h Profile Views Badge

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch traffic and generate badge JSON
        env:
          TRAFFIC_PAT: ${{ secrets.TRAFFIC_PAT }}
          REPO: ${{ github.repository }}
        run: |
          # 1. Fetch traffic data from GitHub REST API
          RESPONSE=$(curl -s -H "Authorization: Bearer $TRAFFIC_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/traffic/views")

          # 2. Extract and sum the last 2 days (48 hours)
          # GitHub returns daily totals in the "views" array
          VIEWS_48H=$(echo "$RESPONSE" | jq '[.views[-2:][].count] | add // 0')
          UNIQUES_48H=$(echo "$RESPONSE" | jq '[.views[-2:][].uniques] | add // 0')

          # 3. Create JSON payload conforming to Shields.io Endpoint schema
          mkdir -p badges
          cat <<EOF > badges/views-48h.json
          {
            "schemaVersion": 1,
            "label": "VIEWS (48H)",
            "message": "${VIEWS_48H} (${UNIQUES_48H} unique)",
            "color": "2563eb"
          }
          EOF

      - name: Commit and push badge data to an orphan branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create and switch to an independent 'badge-data' branch
          git checkout -B badge-data
          git add badges/views-48h.json
          git commit -m "Update 48h view metrics [skip ci]" || exit 0
          git push origin badge-data --force
